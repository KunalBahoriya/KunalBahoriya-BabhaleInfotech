<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Schedule</title>
    <style>
        table {
            width: 80%;
            border-collapse: collapse;
            margin: 20px auto;
        }
        th, td {
            border: 1px solid black;
            text-align: center;
            padding: 10px;
        }
        th {
            background-color: lightgray;
        }
        .office { background-color: tan; }
        .meeting { background-color: gray; }
        .mat108 { background-color: lightgreen; }
        .csc205 { background-color: pink; }
    </style>
</head>
<body>
    <table>
        <tr>
            <th>Time</th>
            <th>Monday</th>
            <th>Tuesday</th>
            <th>Wednesday</th>
            <th>Thursday</th>
            <th>Friday</th>
        </tr>
        <tr>
            <td>1:00</td>
            <td rowspan="2" class="office">Office</td>
            <td></td>
            <td rowspan="2" class="office">Office</td>
            <td rowspan="6" class="office">Office Hours by Appt</td>
            <td rowspan="2" class="office">Office</td>
        </tr>
        <tr>
            <td>1:30</td>
            <td></td>
        </tr>
        <tr>
            <td>2:00</td>
            <td rowspan="2" class="mat108">MAT 108</td>
            <td rowspan="2" class="meeting">Dept Meeting</td>
            <td rowspan="2" class="mat108">MAT 108</td>
            <td rowspan="2" class="mat108">MAT 108</td>
        </tr>
        <tr>
            <td>2:30</td>
        </tr>
        <tr>
            <td>3:00</td>
            <td rowspan="2" class="csc205">CSC 205</td>
            <td rowspan="2" class="meeting">EC Meeting</td>
            <td rowspan="2" class="csc205">CSC 205</td>
            <td rowspan="2" class="csc205">CSC 205</td>
        </tr>
        <tr>
            <td>3:30</td>
        </tr>
    </table>
    
    </body>
    </html>
