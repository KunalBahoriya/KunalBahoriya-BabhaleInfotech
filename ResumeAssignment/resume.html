
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume</title>
</head>
<body>

    <table width="60%" align="center" border="1" cellpadding="10">
        <tr>
            <td colspan="2" align="center">
                <h2>Your Name</h2>
                <p>Email: your.email@example.com | Phone: (123) 456-7890</p>
            </td>
        </tr>
        <tr>
            <td width="30%" align="center">
                <img src="image1.jpg" alt=" Photo" width="150">
            </td>
            <td>
                <h3>Summary</h3>
                <p>Brief description about yourself.</p>
            </td>
        </tr>
        <tr>
            <td><strong>Education</strong></td>
            <td>Degree - University Name, Year</td>
        </tr>
        <tr>
            <td><strong>Experience</strong></td>
            <td>Job Title - Company Name, Year</td>
        </tr>
        <tr>
            <td><strong>Skills</strong></td>
            <td>
                <ul>
                    <li>Skill 1</li>
                    <li>Skill 2</li>
                </ul>
            </td>
        </tr>
    </table>

</body>
</html>
