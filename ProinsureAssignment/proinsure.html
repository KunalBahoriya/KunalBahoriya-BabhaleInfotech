<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fixed Header</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            padding-top: 60px; 
        }
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            background: white;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 1000;
        }
        .logo {
            font-size: 20px;
            font-weight: bold;
            color: #333;
        }
        .nav {
            list-style: none;
            display: flex;
            gap: 20px;
        }
        .nav li {
            display: inline;
        }
        .nav a {
            text-decoration: none;
            color: #333;
            font-size: 16px;
            font-weight: 500;
        }
        .nav a:hover {
            color: #0070d2;
            
        }
        .content {
            padding: 20px;
            line-height: 1.6;
            margin: 20px;
            text-align: left;
            
            

        }
        * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    background-color: #f8f8f8;
}

.banner {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background-color: #2e294e;
    color: #fff;
    padding: 50px;
    max-width: 1200px;
    margin: 50px auto;
    border-radius: 10px;
    overflow: hidden;
}

.text-content {
    flex: 1;
    padding: 40px;
}

.text-content h2 {
    font-size: 2.5rem;
    font-weight: 600;
    margin-bottom: 15px;
}

.text-content p {
    font-size: 1rem;
    line-height: 1.6;
    margin-bottom: 20px;
}

.btn {
    background-color: transparent;
    color: #fff;
    border: 2px solid #fff;
    padding: 10px 20px;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
}

.btn:hover {
    background-color: #fff;
    color: #2e294e;
}

.image-content {
    flex: 1;
    text-align: right;
}

.image-content img {
    max-width: 100%;
    border-radius: 10px;
    height: auto;
}

/* Responsive */
@media (max-width: 768px) {
    .banner {
        flex-direction: column;
        text-align: center;
        padding: 50px;
    }

    .image-content {
        text-align: center;
        margin-top: 20px;
    }
}

        
        
    </style>
</head>
<body>
    <header class="header">
        <div class="logo">Proinsure</div>
        <ul class="nav">
            <li><a href="#">Home</a></li>
            <li><a href="#">About</a></li>
            <li><a href="#">Contact</a></li>
            <button>View Plans</button>
        </ul>
    </header>

    <div class="content">
        <section class="banner">
            <div class="text-content">
                <h2>Humanazing Your <br> Insurance</h2>
                <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Consequatur explicabo temporibus alias magni distinctio sunt unde architecto ipsum dicta, praesentium amet est dolore.</p>
                <button class="btn">View Plans</button>
            </div>
            <div class="image-content">
                <img src="image.png" alt="Family holding a sparkler">
            </div>
        </section>
    
    </div>

</body>
</html>
