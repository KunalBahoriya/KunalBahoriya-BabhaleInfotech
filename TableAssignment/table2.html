<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Device Specifications Table</title>
    <style>
        table {
            width: 60%;
            border-collapse: collapse;
            margin: 20px auto;
            text-align: center;
        }
        th, td {
            border: 1px solid black;
            padding: 10px;
        }
        th {
            background-color: #66CCCC;
        }
        .sub-header {
            background-color: #FFD700;
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Device</th>
        <th>Brand</th>
        <th colspan="2">Specifications</th>
    </tr>
    <tr>
            <td rowspan="2">Smartphone</td>
            <td rowspan="2">Apple</td>
            <td class="sub-header">Model</td>
            <td class="sub-header">Storage</td>
        </tr>
        <tr>
            <td>iPhone 12 Pro</td>
            <td>256GB</td>
        </tr>
        <tr>
            <td colspan="2"></td>
            <td>iPhone SE</td>
            <td>128GB</td>
        </tr>
        <tr>
            <td>Laptop</td>
            <td>HP</td>
            <td colspan="2">15.6" Display</td>
        </tr>
        <tr>
            <td>Tablet</td>
            <td>Samsung</td>
            <td colspan="2">10.5" Display</td>
        </tr>
    </table>
    
    </body>
    </html>
